<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguarde...</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333333;
        }

        .template {
            display: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .show-template .template {
            display: flex;
        }

        .template-inner {
            background: white;
            border-radius: 12px;
            padding: 2rem 3rem;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
            text-align: center;
            max-width: 520px;
        }

        .template-inner h1 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .template-inner p {
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
    </style>
    <script>
        (function redirectToStore() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isIOSDevice = (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) ||
                (navigator.platform === 'MacIntel' && typeof navigator.standalone !== 'undefined');
            var isAndroidDevice = /android/i.test(userAgent);

            if (isIOSDevice) {
                window.location.replace('https://apps.apple.com/us/app/sorteador-live/id6759236995');
                return;
            }

            if (isAndroidDevice) {
                window.location.replace('https://play.google.com/store/apps/details?id=br.com.nucleodigitalagencia.sorteador');
                return;
            }

            document.documentElement.classList.add('show-template');
        })();
    </script>
</head>
<body>
    <main class="template">
        <div class="template-inner">
            <!-- TEMPLATE: Fallback content for non-mobile devices -->
            <h1>Download Our App</h1>
            <p>Access the app stores directly on your mobile device to download our latest application. In the meantime, explore more about what we offer below.</p>
            <a href="#" style="display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: #2563eb; color: white; border-radius: 6px; text-decoration: none;">Learn More</a>
            <!-- TEMPLATE: End fallback content -->
        </div>
    </main>
</body>
</html>
